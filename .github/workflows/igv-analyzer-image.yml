# Builds and publishes the prebuilt headless BGV analyzer image. This is the
# only place GRAAL_IGVUTIL is compiled for consumers; normal analysis pulls
# the versioned image and never builds it.

name: igv-analyzer-image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - docker/igv-analyzer/**
      - .github/workflows/igv-analyzer-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: igv-analyzer-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/guillermomolina/protos-benchmarks/igv-analyzer
  ANALYZER_GRAAL_VERSION: 25.4.4.1.1

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/igv-analyzer/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:graal-${{ env.ANALYZER_GRAAL_VERSION }}
            ${{ env.IMAGE }}:graal-${{ env.ANALYZER_GRAAL_VERSION }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
